[project]
name = "forgedesk"
version = "0.1.0"
description = "ForgeDesk: a full-duplex voice front desk that survives interruptions mid-speech and mid-tool-call. Rime TTS is the primary spoken output."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "websockets>=12",
    "numpy>=1.26",
    "openai>=1.30",
    "python-dotenv>=1.0",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["forgedesk*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
